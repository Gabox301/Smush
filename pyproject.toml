[project]
name = "smush"
version = "1.0.0"
description = "Compresor de imágenes AVIF, WEBP, JPEG y PNG a porcentaje objetivo manteniendo dimensiones"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-multipart>=0.0.32",
    "Pillow==12.3.0",
    # Flet 1.0 reworks FilePicker into page services with async methods;
    # migrar a conciencia, no por accidente en un upgrade.
    "flet[desktop]>=0.86.5,<1.0",
    "numpy>=2.5.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx2>=2.12.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pyinstaller>=6.22.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smush_gui"]
only-include = ["api.py", "compressor_core", "flet_app.py", "smush_gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests as slow",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "S", "ANN", "RUF", "W"]
ignore = [
    "ANN401",  # los dicts de metadata usan Any a propósito
    "S101",  # asserts como invariantes + tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S311"]  # Random con seed fija para imágenes deterministas
