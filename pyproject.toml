[project]
name = "smush"
version = "1.0.0"
description = "Compresor de imágenes AVIF, WEBP, JPEG y PNG a porcentaje objetivo manteniendo dimensiones"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-multipart>=0.0.32",
    "Pillow==12.3.0",
    "flet[desktop]>=0.86.5",
    "numpy>=2.5.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx2>=2.12.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smush_gui"]
only-include = ["app.py", "compressor_core.py", "flet_app.py", "smush_gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests as slow",
]
