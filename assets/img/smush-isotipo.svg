<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Sombra dura desplazada (estilo sticker neobrutalista) -->
  <circle cx="106" cy="108" r="80" fill="#17170f"/>

  <!-- Disco base -->
  <circle cx="100" cy="100" r="80" fill="#c6ff5e" stroke="#17170f" stroke-width="7"/>

  <!-- Flecha izquierda empujando hacia adentro -->
  <path d="M32,84 L48,100 L32,116" fill="none" stroke="#17170f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Flecha derecha empujando hacia adentro -->
  <path d="M168,84 L152,100 L168,116" fill="none" stroke="#17170f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Silueta de "imagen apretada" (reloj de arena) -->
  <path d="M70,66
           Q70,50 86,50
           L114,50
           Q130,50 130,66
           L130,88
           Q130,100 100,100
           Q130,100 130,112
           L130,134
           Q130,150 114,150
           L86,150
           Q70,150 70,134
           L70,112
           Q70,100 100,100
           Q70,100 70,88
           Z"
        fill="#17170f"/>

  <!-- Costura/pliegue de compresión -->
  <path d="M64,100 Q78,90 92,100 T120,100 T136,100"
        fill="none" stroke="#ff5d45" stroke-width="7" stroke-linecap="round"/>
</svg>
